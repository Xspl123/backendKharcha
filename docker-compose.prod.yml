services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: apnakharcha-api
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    depends_on:
      - db
    networks:
      - apnakharcha

  nginx:
    image: nginx:1.27-alpine
    container_name: apnakharcha-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - .:/var/www/html:ro
      - /var/www/manage.apnakharcha.in:/var/www/manage.apnakharcha.in:ro
      - ./nginx/apnakharcha.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - apnakharcha

  db:
    image: mysql:8.0
    container_name: apnakharcha-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-laravel_db}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - apnakharcha

networks:
  apnakharcha:

volumes:
  mysql_data:
